<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჩემი პორტფოლიო</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <p class="header__name">შენი სახელი</p>
    <nav class="header__nav" aria-label="მთავარი მენიუ">
        <a class="header__link" href="#about">ჩემ შესახებ</a>
        <a class="header__link" href="#projects">პროექტები</a>
        <a class="header__link" href="#contact">კონტაქტი</a>
    </nav>
</header>
<main>
    <section class="section" id="about">
        <h1 class="section__title">გამარჯობა! მე ვსწავლობ ვებ-დეველოპმენტს.</h1>
        <p class="section__text">აქ მოკლედ დაწერე შენ შესახებ.</p>
    </section>
    <section class="section" id="projects">
        <h2 class="section__title">პროექტები</h2>
        <p class="section__text">აქ შენი პროექტები გამოჩნდება.</p>
    </section>
    <section class="section" id="contact">
        <h2 class="section__title">კონტაქტი</h2>
        <p class="section__text">ელფოსტა: name@example.com</p>
    </section>
</main>
</body>
</html>
